<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日计划 · 生活手记</title>
    <style id="theme-vars">
:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --card-raised: #ffffff;
  --surface: #f1f0ec;
  --surface-hover: #ebeae6;

  --border: #e8e6e1;
  --border-soft: #eeede9;
  --input: #e0ded9;

  --text: #1f1f1f;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9a9a9a;

  --accent: #397565;
  --accent-soft: #e8f0ed;
  --accent-foreground: #ffffff;

  --module-green: #397565;
  --module-blue: #4a7c8c;
  --module-ochre: #a67c00;
  --module-clay: #a85d4a;
  --module-olive: #7a7a5a;

  --danger: #c45c4a;
  --danger-soft: #f7e8e5;

  --drawer-bg: #252522;
  --drawer-bg-top: #2f2f2c;
  --drawer-text: #f7f6f3;
  --drawer-text-mute: rgba(247, 246, 243, 0.55);
  --drawer-hover: rgba(247, 246, 243, 0.08);
  --drawer-active: rgba(247, 246, 243, 0.14);

  --shadow-card: 0 1px 2px rgba(31, 31, 31, 0.04), 0 6px 20px rgba(31, 31, 31, 0.06);
  --shadow-overlay: 0 10px 30px rgba(31, 31, 31, 0.12);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 9999px;

  --background: var(--bg);
  --foreground: var(--text);
  --card-foreground: var(--text);
  --popover: var(--card);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-foreground);
  --secondary: var(--surface);
  --secondary-foreground: var(--text);
  --muted: var(--surface);
  --muted-foreground: var(--text-secondary);
  --accent: var(--accent);
  --accent-foreground: var(--accent-foreground);
  --destructive: var(--danger);
  --destructive-foreground: #ffffff;
  --border: var(--border);
  --input: var(--input);
  --ring: var(--accent);
  --radius: var(--radius-md);

  --font-sans: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bg);
    --color-foreground: var(--text);
    --color-card: var(--card);
    --color-card-foreground: var(--text);
    --color-popover: var(--card);
    --color-popover-foreground: var(--text);
    --color-primary: var(--accent);
    --color-primary-foreground: var(--accent-foreground);
    --color-secondary: var(--surface);
    --color-secondary-foreground: var(--text);
    --color-muted: var(--surface);
    --color-muted-foreground: var(--text-secondary);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--danger);
    --color-destructive-foreground: #ffffff;
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--accent);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
  }
  @layer base {
    body { background: var(--bg); color: var(--text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">

      .bg-popover-foreground { background-color: var(--text); }

      .ring-primary-foreground { --tw-ring-color: var(--accent-foreground); }

      .ring-accent-foreground { --tw-ring-color: var(--accent-foreground); }
      .bg-destructive { background-color: var(--danger); }
      .text-destructive { color: var(--danger); }
      .border-destructive { border-color: var(--danger); }
      .ring-destructive { --tw-ring-color: var(--danger); }
      .bg-destructive-foreground { background-color: #ffffff; }
      .text-destructive-foreground { color: #ffffff; }
      .border-destructive-foreground { border-color: #ffffff; }
      .ring-destructive-foreground { --tw-ring-color: #ffffff; }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--input); }
      .text-input { color: var(--input); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;

</head>
<body class="min-h-screen bg-background font-sans antialiased">
  <style>
    .shadow-card { box-shadow: var(--shadow-card); }
    .shadow-overlay { box-shadow: var(--shadow-overlay); }
    .bg-drawer { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); }
    .text-module-green { color: var(--module-green); }
    .text-module-blue { color: var(--module-blue); }
    .text-module-ochre { color: var(--module-ochre); }
    .text-module-clay { color: var(--module-clay); }
    .text-module-olive { color: var(--module-olive); }
    .bg-module-green { background-color: var(--module-green); }
    .bg-module-blue { background-color: var(--module-blue); }
    .bg-module-ochre { background-color: var(--module-ochre); }
    .bg-module-clay { background-color: var(--module-clay); }
    .bg-module-olive { background-color: var(--module-olive); }
    .border-module-blue { border-color: var(--module-blue); }
    .border-module-ochre { border-color: var(--module-ochre); }
    .border-module-green { border-color: var(--module-green); }
    .ring-track { stroke: var(--surface); }
    .ring-blue { stroke: var(--module-blue); }
  </style>

  <aside class="fixed left-0 top-0 z-30 flex h-full w-16 flex-col bg-drawer text-[var(--drawer-text)]">
    <a href="profile.html" title="个人中心" class="flex h-16 items-center justify-center border-b border-[var(--drawer-hover)] transition-colors hover:bg-[var(--drawer-hover)]">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-[var(--module-green)] to-[#2e5c4e] text-[var(--drawer-text)]">
        <i data-lucide="user" class="h-5 w-5"></i>
      </span>
    </a>
    <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-2 no-scrollbar">
      <a href="home.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="home" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">首页</span>
      </a>
      <div class="nav-item active flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[#ffffff] cursor-default" style="background: linear-gradient(160deg, var(--module-green), #2e5c4e); box-shadow: 0 4px 12px rgba(57,117,101,0.35);">
        <i data-lucide="calendar-check" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">今日计划</span>
      </div>
      <a href="habits.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="check-circle-2" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">习惯打卡</span>
      </a>
      <a href="reading.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="book-open" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">阅读</span>
      </a>
      <a href="accounting.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="receipt" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">记账</span>
      </a>
      <a href="essay.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="pen-tool" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">随笔</span>
      </a>
      <a href="clipping.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="newspaper" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">剪报</span>
      </a>
      <a href="insight.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="bar-chart-2" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">洞察</span>
      </a>
    </nav>
  </aside>

  <main class="relative ml-16 min-h-screen bg-background p-4 pb-24">
    <header class="mb-5 flex items-end justify-between">
      <div>
        <div class="flex items-center gap-2">
          <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-module-blue text-primary-foreground">
            <i data-lucide="calendar-check" class="h-4 w-4"></i>
          </div>
          <h1 class="text-xl font-semibold tracking-tight text-foreground">今日计划</h1>
        </div>
        <p class="mt-1 text-xs text-muted-foreground">安排优先级，聚焦最重要的事</p>
      </div>
    </header>

    <!-- 今日完成进度 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="mb-1.5 flex items-center gap-2 text-xs font-medium text-muted-foreground">
        <span>今日完成进度</span>
        <span class="ml-auto inline-flex gap-1">
          <span class="rounded bg-[var(--danger-soft)] px-1.5 py-0.5 text-[10px] font-medium text-[var(--danger)]">P0 1</span>
          <span class="rounded bg-[var(--accent-soft)] px-1.5 py-0.5 text-[10px] font-medium text-module-ochre">P1 1</span>
          <span class="rounded bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground">P2 1</span>
        </span>
      </div>
      <div class="text-2xl font-semibold text-foreground">1/3 已完成</div>
      <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-muted">
        <div class="h-full rounded-full bg-module-blue" style="width: 33%"></div>
      </div>
    </section>

    <!-- 搜索计划或备注 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-3 shadow-card">
      <div class="flex items-center gap-2">
        <i data-lucide="search" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
        <input type="text" placeholder="搜索计划或备注…" class="w-full bg-transparent text-sm text-foreground outline-none placeholder:text-muted-foreground">
      </div>
    </section>

    <!-- 计划列表 -->
    <section class="mb-4">
      <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-foreground">
        <span class="h-3.5 w-1 rounded-full bg-module-blue"></span>
        <span>全部记录</span>
        <span class="ml-auto text-xs font-medium text-muted-foreground">3 项</span>
      </div>
      <div class="flex flex-col gap-3">
        <div class="flex gap-3 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
          <button class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-input bg-card text-primary-foreground transition hover:border-muted-foreground"><i data-lucide="check" class="h-3 w-3 opacity-0"></i></button>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-semibold text-foreground">确定今日最重要的一件事</div>
            <div class="mt-0.5 text-[10px] text-muted-foreground">先做最重要的事</div>
            <div class="mt-2 flex items-center gap-2">
              <span class="rounded bg-[var(--danger-soft)] px-1.5 py-0.5 text-[10px] font-medium text-[var(--danger)]">P0</span>
              <span class="text-[10px] text-muted-foreground">8月29日</span>
            </div>
          </div>
          <div class="flex shrink-0 flex-col items-center gap-3 text-muted-foreground">
            <button class="transition hover:text-module-ochre"><i data-lucide="flag" class="h-4 w-4"></i></button>
            <button class="transition hover:text-module-blue"><i data-lucide="pencil" class="h-4 w-4"></i></button>
            <button class="transition hover:text-[var(--danger)]"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
          </div>
        </div>

        <div class="flex gap-3 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
          <button class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-input bg-card text-primary-foreground transition hover:border-muted-foreground"><i data-lucide="check" class="h-3 w-3 opacity-0"></i></button>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-semibold text-foreground">整理桌面并给房间通风</div>
            <div class="mt-2 flex items-center gap-2">
              <span class="rounded bg-[var(--accent-soft)] px-1.5 py-0.5 text-[10px] font-medium text-module-ochre">P1</span>
              <span class="text-[10px] text-muted-foreground">8月29日</span>
            </div>
          </div>
          <div class="flex shrink-0 flex-col items-center gap-3 text-muted-foreground">
            <button class="transition hover:text-module-ochre"><i data-lucide="flag" class="h-4 w-4"></i></button>
            <button class="transition hover:text-module-blue"><i data-lucide="pencil" class="h-4 w-4"></i></button>
            <button class="transition hover:text-[var(--danger)]"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
          </div>
        </div>

        <div class="flex gap-3 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
          <button class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border border-module-ochre bg-module-ochre text-primary-foreground"><i data-lucide="check" class="h-3 w-3"></i></button>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-normal text-muted-foreground line-through">晚饭后整理今日小票并记账</div>
            <div class="mt-2 flex items-center gap-2">
              <span class="rounded bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground">P2</span>
              <span class="text-[10px] text-muted-foreground">8月29日</span>
            </div>
          </div>
          <div class="flex shrink-0 flex-col items-center gap-3 text-muted-foreground">
            <button class="transition hover:text-module-ochre"><i data-lucide="flag" class="h-4 w-4"></i></button>
            <button class="transition hover:text-module-blue"><i data-lucide="pencil" class="h-4 w-4"></i></button>
            <button class="transition hover:text-[var(--danger)]"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 悬浮添加按钮 -->
    <button class="fixed bottom-6 right-6 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-accent text-primary-foreground shadow-overlay transition hover:brightness-110 active:scale-95">
      <i data-lucide="plus" class="h-6 w-6"></i>
    </button>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
