<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记账 · 生活手记</title>
    <style id="theme-vars">
:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --card-raised: #ffffff;
  --surface: #f1f0ec;
  --surface-hover: #ebeae6;

  --border: #e8e6e1;
  --border-soft: #eeede9;
  --input: #e0ded9;

  --text: #1f1f1f;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9a9a9a;

  --accent: #397565;
  --accent-soft: #e8f0ed;
  --accent-foreground: #ffffff;

  --module-green: #397565;
  --module-blue: #4a7c8c;
  --module-ochre: #a67c00;
  --module-clay: #a85d4a;
  --module-olive: #7a7a5a;

  --danger: #c45c4a;
  --danger-soft: #f7e8e5;

  --drawer-bg: #252522;
  --drawer-bg-top: #2f2f2c;
  --drawer-text: #f7f6f3;
  --drawer-text-mute: rgba(247, 246, 243, 0.55);
  --drawer-hover: rgba(247, 246, 243, 0.08);
  --drawer-active: rgba(247, 246, 243, 0.14);

  --shadow-card: 0 1px 2px rgba(31, 31, 31, 0.04), 0 6px 20px rgba(31, 31, 31, 0.06);
  --shadow-overlay: 0 10px 30px rgba(31, 31, 31, 0.12);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 9999px;

  --background: var(--bg);
  --foreground: var(--text);
  --card-foreground: var(--text);
  --popover: var(--card);
  --popover-foreground: var(--text);
  --primary: var(--accent);
  --primary-foreground: var(--accent-foreground);
  --secondary: var(--surface);
  --secondary-foreground: var(--text);
  --muted: var(--surface);
  --muted-foreground: var(--text-secondary);
  --accent: var(--accent);
  --accent-foreground: var(--accent-foreground);
  --destructive: var(--danger);
  --destructive-foreground: #ffffff;
  --border: var(--border);
  --input: var(--input);
  --ring: var(--accent);
  --radius: var(--radius-md);

  --font-sans: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bg);
    --color-foreground: var(--text);
    --color-card: var(--card);
    --color-card-foreground: var(--text);
    --color-popover: var(--card);
    --color-popover-foreground: var(--text);
    --color-primary: var(--accent);
    --color-primary-foreground: var(--accent-foreground);
    --color-secondary: var(--surface);
    --color-secondary-foreground: var(--text);
    --color-muted: var(--surface);
    --color-muted-foreground: var(--text-secondary);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--danger);
    --color-destructive-foreground: #ffffff;
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--accent);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
  }
  @layer base {
    body { background: var(--bg); color: var(--text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .ring-secondary-foreground { --tw-ring-color: var(--text); }
      .bg-muted { background-color: var(--surface); }

      .bg-destructive { background-color: var(--danger); }
      .text-destructive { color: var(--danger); }

      .ring-destructive { --tw-ring-color: var(--danger); }
      .bg-destructive-foreground { background-color: #ffffff; }
      .text-destructive-foreground { color: #ffffff; }
      .border-destructive-foreground { border-color: #ffffff; }
      .ring-destructive-foreground { --tw-ring-color: #ffffff; }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="min-h-screen bg-background font-sans antialiased">
  <style>
    .shadow-card { box-shadow: var(--shadow-card); }
    .shadow-overlay { box-shadow: var(--shadow-overlay); }
    .bg-drawer { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); }
    .text-module-clay { color: var(--module-clay); }
    .text-module-blue { color: var(--module-blue); }
    .bg-module-clay { background-color: var(--module-clay); }
    .bg-module-blue { background-color: var(--module-blue); }
  </style>

  <aside class="fixed left-0 top-0 z-30 flex h-full w-16 flex-col bg-drawer text-[var(--drawer-text)]">
    <a href="profile.html" title="个人中心" class="flex h-16 items-center justify-center border-b border-[var(--drawer-hover)] transition-colors hover:bg-[var(--drawer-hover)]">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-[var(--module-green)] to-[#2e5c4e] text-[var(--drawer-text)]">
        <i data-lucide="user" class="h-5 w-5"></i>
      </span>
    </a>
    <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-2 no-scrollbar">
      <a href="home.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="home" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">首页</span>
      </a>
      <a href="plan.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="calendar-check" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">今日计划</span>
      </a>
      <a href="habits.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="check-circle-2" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">习惯打卡</span>
      </a>
      <a href="reading.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="book-open" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">阅读</span>
      </a>
      <div class="nav-item active flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[#ffffff] cursor-default" style="background: linear-gradient(160deg, var(--module-green), #2e5c4e); box-shadow: 0 4px 12px rgba(57,117,101,0.35);">
        <i data-lucide="receipt" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">记账</span>
      </div>
      <a href="essay.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="pen-tool" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">随笔</span>
      </a>
      <a href="clipping.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="newspaper" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">剪报</span>
      </a>
      <a href="insight.html" class="nav-item flex flex-col items-center justify-center gap-1 rounded-xl py-3 text-[var(--drawer-text-mute)] hover:bg-[var(--drawer-hover)] transition-colors">
        <i data-lucide="bar-chart-2" class="h-5 w-5"></i>
        <span class="text-[10px] font-medium leading-none">洞察</span>
      </a>
    </nav>
  </aside>

  <main class="ml-16 min-h-screen bg-background p-4">
    <header class="mb-5 flex items-end justify-between">
      <div>
        <div class="flex items-center gap-2">
          <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-module-clay text-primary-foreground">
            <i data-lucide="receipt" class="h-4 w-4"></i>
          </div>
          <h1 class="text-xl font-semibold tracking-tight text-foreground">记账</h1>
        </div>
        <p class="mt-1 text-xs text-muted-foreground">每一笔都心里有数</p>
      </div>
      <button class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-primary text-primary-foreground shadow-card transition hover:opacity-90 active:scale-95">
        <i data-lucide="plus" class="h-5 w-5"></i>
      </button>
    </header>

    <!-- 收支结余概览 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="grid grid-cols-4 gap-2 text-center">
        <div>
          <div class="text-[10px] font-medium text-muted-foreground">收入</div>
          <div class="mt-1 text-sm font-semibold text-module-green">¥12,862</div>
        </div>
        <div>
          <div class="text-[10px] font-medium text-muted-foreground">支出</div>
          <div class="mt-1 text-sm font-semibold text-module-clay">¥2,480</div>
        </div>
        <div>
          <div class="text-[10px] font-medium text-muted-foreground">结余</div>
          <div class="mt-1 text-sm font-semibold text-module-ochre">¥10,382</div>
        </div>
        <div>
          <div class="text-[10px] font-medium text-muted-foreground">笔数</div>
          <div class="mt-1 text-sm font-semibold text-foreground">12</div>
        </div>
      </div>
    </section>

    <!-- 搜索 + 记一笔 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="flex items-center gap-2 rounded-[var(--radius-md)] border border-input bg-background px-3 py-2">
        <i data-lucide="search" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
        <input type="text" placeholder="搜索商户、分类、备注…" class="w-full bg-transparent text-sm text-foreground outline-none placeholder:text-muted-foreground">
      </div>
      <button class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-[var(--radius-md)] bg-accent px-4 py-3 text-sm font-semibold text-primary-foreground shadow-card transition hover:brightness-110">
        <i data-lucide="plus" class="h-4 w-4"></i>
        <span>记一笔</span>
      </button>
    </section>

    <!-- 分类占比 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="mb-4 flex items-center gap-2 text-sm font-semibold text-foreground">
        <span class="h-3.5 w-1 rounded-full bg-module-clay"></span>
        <span>分类占比</span>
        <span class="ml-auto inline-flex rounded-full border border-border bg-secondary p-0.5 text-[10px] font-medium">
          <span class="rounded-full bg-accent px-2.5 py-0.5 text-primary-foreground">支出</span>
          <span class="px-2.5 py-0.5 text-muted-foreground">收入</span>
        </span>
      </div>
      <div class="flex items-center gap-5">
        <div class="relative h-28 w-28 shrink-0">
          <svg class="h-full w-full -rotate-90" viewBox="0 0 36 36">
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--surface)" stroke-width="3"></path>
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--module-clay)" stroke-width="3" stroke-dasharray="42 100" stroke-linecap="round"></path>
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--module-blue)" stroke-width="3" stroke-dasharray="21 100" stroke-dashoffset="-42" stroke-linecap="round"></path>
            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--module-ochre)" stroke-width="3" stroke-dasharray="14 100" stroke-dashoffset="-63" stroke-linecap="round"></path>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-lg font-semibold text-foreground">12</span>
            <span class="text-[10px] text-muted-foreground">笔</span>
          </div>
        </div>
        <div class="flex-1 flex flex-col gap-2.5">
          <div class="flex items-center justify-between text-xs">
            <span class="inline-flex items-center gap-1.5 text-secondary-foreground"><span class="h-2 w-2 rounded-full bg-module-clay"></span>餐饮</span>
            <span class="font-semibold text-module-clay">¥860</span>
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="inline-flex items-center gap-1.5 text-secondary-foreground"><span class="h-2 w-2 rounded-full bg-module-blue"></span>交通</span>
            <span class="font-semibold text-module-blue">¥320</span>
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="inline-flex items-center gap-1.5 text-secondary-foreground"><span class="h-2 w-2 rounded-full bg-module-ochre"></span>购物</span>
            <span class="font-semibold text-module-ochre">¥540</span>
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="inline-flex items-center gap-1.5 text-secondary-foreground"><span class="h-2 w-2 rounded-full bg-module-green"></span>其他</span>
            <span class="font-semibold text-module-green">¥760</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 趋势 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-foreground">
        <span class="h-3.5 w-1 rounded-full bg-module-blue"></span>
        <span>支出趋势</span>
        <span class="ml-auto text-xs font-medium text-muted-foreground">近 7 天</span>
      </div>
      <svg class="h-24 w-full" viewBox="0 0 300 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id="expenseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--module-clay)" stop-opacity="0.3"></stop>
            <stop offset="100%" stop-color="var(--module-clay)" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <path d="M0,70 C40,60 60,45 90,55 C120,65 140,40 170,50 C200,60 230,30 260,42 C280,48 300,35 300,35 L300,100 L0,100 Z" fill="url(#expenseGrad)"></path>
        <path d="M0,70 C40,60 60,45 90,55 C120,65 140,40 170,50 C200,60 230,30 260,42 C280,48 300,35 300,35" fill="none" stroke="var(--module-clay)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div class="mt-2 flex justify-between px-1 text-[10px] text-muted-foreground">
        <span>周二</span><span>周四</span><span>周六</span><span>今天</span>
      </div>
    </section>

    <!-- 统计问答 -->
    <section class="mb-4 rounded-[var(--radius-lg)] border border-module-blue/20 bg-module-blue/5 p-4 shadow-card">
      <div class="mb-2 flex items-center gap-2 text-sm font-semibold text-module-blue">
        <i data-lucide="message-circle-question" class="h-4 w-4"></i>
        <span>统计问答</span>
      </div>
      <p class="text-xs leading-relaxed text-secondary-foreground">问问 AI：这个月餐饮花了多少？哪类支出最多？</p>
      <div class="mt-3 flex gap-2">
        <input type="text" placeholder="输入你的问题…" class="flex-1 rounded-[var(--radius-md)] border border-input bg-card px-3 py-2 text-sm text-foreground outline-none placeholder:text-muted-foreground focus:border-accent focus:ring-2 focus:ring-[var(--accent-soft)]">
        <button class="inline-flex items-center gap-1 rounded-[var(--radius-md)] bg-module-blue px-3.5 py-2 text-sm font-medium text-primary-foreground shadow-card transition hover:brightness-110">
          <i data-lucide="send" class="h-4 w-4"></i>
        </button>
      </div>
    </section>

    <!-- 最近账目 -->
    <section class="mb-6 rounded-[var(--radius-lg)] border border-border bg-card p-4 shadow-card">
      <div class="mb-3 flex items-center gap-2 text-sm font-semibold text-foreground">
        <span class="h-3.5 w-1 rounded-full bg-module-clay"></span>
        <span>最近账目</span>
        <span class="ml-auto text-xs font-medium text-muted-foreground">本月 12 笔</span>
      </div>
      <div class="flex flex-col divide-y divide-[var(--border-soft)]">
        <div class="flex items-center gap-3 py-3">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-module-clay/10 text-module-clay"><i data-lucide="utensils" class="h-4 w-4"></i></div>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium text-foreground">午餐</div>
            <div class="text-[10px] text-muted-foreground">8月29日 · 餐饮</div>
          </div>
          <span class="text-sm font-semibold text-foreground">-¥38</span>
        </div>
        <div class="flex items-center gap-3 py-3">
